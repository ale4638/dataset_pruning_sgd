training:
  epochs: 200
  batch_size: 256
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  num_workers: 4

model:
  name: resnet50

datasets:
  cifar10:
    root: ./data
    num_classes: 10
    pruning_ratios: [0, 2, 10, 20, 40, 60, 80]
  cifar100:
    root: ./data
    num_classes: 100
    pruning_ratios: [0, 2, 10, 20, 30, 40, 50]
    augmentation:
      strong_aug: true
      mixup_alpha: 0.8
      cutmix_alpha: 0.8
      mixup_prob: 0.5
      label_smoothing: 0.1
  tinyimagenet:
    root: ./data/tiny-imagenet-200
    num_classes: 200
    pruning_ratios: [0, 2, 10, 20, 30, 40, 50]

pruning:
  method: herding
  seeds: [0, 1, 2]
  deterministic: true
  # Feature extraction settings for herding
  feature_batch_size: 256
  feature_num_workers: 4

output:
  root: results/herding
  save_checkpoints: false
